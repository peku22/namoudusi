name: namoudusi

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: ${DB_NAME}
  WORDPRESS_DB_USER: ${DB_USER}
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}

services:
  web:
    build:
      context: docker/php
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: namoudusi-php:8.5-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Same host:port inside and outside Docker, so WP loopback requests work
    ports:
      - "127.0.0.1:8180:8180"
    volumes:
      - ./public:/var/www/html
    environment:
      <<: *wp-env
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases: [namoudusi.localhost]

  # Real cron instead of WP-cron (DISABLE_WP_CRON in wp-config)
  cron:
    image: namoudusi-php:8.5-apache
    restart: unless-stopped
    depends_on:
      - web
    user: www-data
    volumes:
      - ./public:/var/www/html
    environment:
      <<: *wp-env
      XDEBUG_MODE: "off"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          wp core is-installed --quiet 2>/dev/null && wp cron event run --due-now --quiet
          sleep 60
        done

  db:
    image: mariadb:10.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8125}:8025"

volumes:
  db_data:
